<script>
    const idade = prompt("Qual a sua idade?");

    console.log(`idade` , idade);
    // == - Igual
    // > - Maior que
    // < - Menor que
    // >= - Maior ou igual 
    // <= - Menor ou igual

    if (idade >= 18) {
        console.log("É maior que 18 anos");
    } else {
        console.log("Não é maior que 18 anos");
    }

</script>
